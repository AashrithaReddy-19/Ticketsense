[project]
name = "ticketsense-backend"
version = "0.1.0"
description = "TicketSense FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "bcrypt>=4.2",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
# ai/ scripts: dataset import (data/), the embedding pipeline and LangGraph skeleton
# (ai/embeddings/, ai/graph/), and classifier training (ai/models/). Kept out of the
# default install since sentence-transformers/datasets pull in torch/pyarrow/pandas
# that the API itself doesn't need — becomes core once retrieval/classification are
# wired into the live request path.
ai = [
    "datasets>=3.0.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5",
    "langgraph>=0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
