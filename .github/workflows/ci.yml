name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ticketsense
          POSTGRES_PASSWORD: ticketsense
          POSTGRES_DB: ticketsense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticketsense -d ticketsense"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      DATABASE_URL: postgresql+asyncpg://ticketsense:ticketsense@localhost:5432/ticketsense
      JWT_SECRET_KEY: ci-only-secret-never-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies (mirrors backend/Dockerfile)
        working-directory: backend
        run: |
          pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu torch
          pip install --no-cache-dir ".[dev,rag]"
      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Seed demo data and train the real classifier artifacts (mirrors backend/Dockerfile's bootstrap)
        working-directory: backend
        run: |
          python ../db/seed/run_seed.py
          python ../db/seed/load_knowledge_base.py
          python ../data/synthetic_labeled_tickets.py
          python ../ai/models/train_classifier.py
          python ../ai/models/train_classifier_challenger.py
      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Run frontend test suite
        working-directory: frontend
        run: npm run test
      - name: Production build
        working-directory: frontend
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    # Reports real, live advisory-database results — never a fabricated "0 vulnerabilities"
    # claim. Non-blocking (continue-on-error) because a newly published advisory in a
    # transitive dependency must not silently block every PR; a human reviews the report.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install --no-cache-dir ".[dev,rag]"
      - name: pip-audit (backend dependencies)
        working-directory: backend
        run: pip install pip-audit && python -m pip_audit
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: npm audit (frontend dependencies)
        working-directory: frontend
        run: npm audit --omit=dev
        continue-on-error: true

  sbom:
    runs-on: ubuntu-latest
    # Regenerates a real CycloneDX SBOM from the actual installed environment on every
    # build — see docs/sbom/README.md for the committed example snapshot and how to
    # regenerate one locally.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install --no-cache-dir ".[dev,rag]" cyclonedx-bom
      - name: Generate backend SBOM
        working-directory: backend
        run: python -m cyclonedx_py environment --output-format json --output-file ../backend-sbom.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Generate frontend SBOM
        working-directory: frontend
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file ../frontend-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend-sbom.json
            frontend-sbom.json
